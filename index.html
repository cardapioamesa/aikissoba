<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aikissoba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
</head>
<body>
<style>
  :root{
    --ink:#120E0C;
    --ink-2:#1B1512;
    --ink-3:#241C18;
    --line:#312520;
    --rice:#F6EFE4;
    --ash:#AC9C8F;
    --ash-dim:#7E7068;
    --beni:#D93A25;
    --beni-lt:#FF6A48;
    --dashi:#E9C579;

    --display:"Shippori Mincho B1",'Hiragino Mincho ProN',Georgia,serif;
    --body:"Zen Kaku Gothic New",'Hiragino Sans','Segoe UI',system-ui,sans-serif;

    --wrap:1040px;
    color-scheme:dark;

    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}

  body{
    margin:0;
    background:var(--ink);
    color:var(--rice);
    font-family:var(--body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  img{display:block;max-width:100%}
  a{color:inherit}

  :focus-visible{outline:2px solid var(--dashi);outline-offset:3px;border-radius:4px}

  .wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:20px}

  /* ---------- barra fixa ---------- */
  .bar{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:40;
    background:rgba(18,14,12,.86);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .bar-in{display:flex;align-items:center;gap:14px;padding-block:10px}
  .bar-mark{display:flex;align-items:center;gap:9px;flex:0 0 auto;text-decoration:none}
  .bar-mark img{
    width:34px;height:34px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 1px rgba(246,239,228,.14);
  }
  .bar-mark b{
    font-family:var(--display);font-weight:800;font-size:15px;
    letter-spacing:.14em;color:var(--rice);
  }
  .tabs{
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    margin-left:auto;padding-block:2px;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{
    flex:0 0 auto;text-decoration:none;
    font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ash);padding:7px 12px;border-radius:999px;
    border:1px solid transparent;white-space:nowrap;
    transition:color .18s ease,background .18s ease,border-color .18s ease;
  }
  .tabs a:hover{color:var(--rice)}
  .tabs a[aria-current="true"]{color:var(--ink);background:var(--dashi);border-color:var(--dashi)}


  /* ---------- abertura ---------- */
  .hero{
    position:relative;overflow:hidden;text-align:center;
    padding-block:52px 46px;border-bottom:1px solid var(--line);
  }
  .hero::before{
    content:"";position:absolute;inset:-40px 0 0;
    background-image:
      radial-gradient(circle at 50% 100%, transparent 0 13px, rgba(217,58,37,.5) 13px 14.5px, transparent 15px),
      radial-gradient(circle at 50% 100%, transparent 0 21px, rgba(217,58,37,.5) 21px 22.5px, transparent 23px),
      radial-gradient(circle at 50% 100%, transparent 0 29px, rgba(217,58,37,.5) 29px 30.5px, transparent 31px);
    background-size:64px 32px;opacity:.16;
    -webkit-mask-image:linear-gradient(to bottom, #000 0%, transparent 72%);
    mask-image:linear-gradient(to bottom, #000 0%, transparent 72%);
    pointer-events:none;
  }
  .hero::after{
    content:"";position:absolute;left:50%;top:38%;translate:-50% -50%;
    width:min(760px,130%);aspect-ratio:1;
    background:radial-gradient(circle, rgba(233,197,121,.13) 0%, rgba(233,197,121,.04) 42%, transparent 68%);
    pointer-events:none;
  }
  .hero > *{position:relative}

  .badge{
    width:112px;height:112px;margin:0 auto 22px;border-radius:50%;background:#fff;
    box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(246,239,228,.16), 0 0 46px rgba(217,58,37,.22);
  }
  .badge img{width:100%;height:100%;border-radius:50%}

  .kana{
    font-family:var(--display);font-weight:500;font-size:13px;
    letter-spacing:.42em;color:var(--beni-lt);margin:0 0 12px;text-indent:.42em;
  }
  .hero h1{
    font-family:var(--display);font-weight:800;font-size:clamp(38px,10.5vw,74px);
    letter-spacing:.1em;line-height:1;margin:0;text-indent:.1em;text-wrap:balance;
  }
  .rule{width:54px;height:2px;margin:22px auto 20px;background:linear-gradient(90deg,transparent,var(--beni),transparent)}
  .lede{max-width:33ch;margin:0 auto;color:var(--ash);font-size:16.5px;line-height:1.66;text-wrap:balance}

  .cta-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
  .cta{
    display:inline-flex;align-items:center;gap:9px;text-decoration:none;
    font-weight:700;font-size:14.5px;letter-spacing:.03em;
    padding:13px 24px;border-radius:999px;border:0;font-family:inherit;cursor:pointer;
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .cta-a{background:var(--beni);color:#fff;box-shadow:0 10px 26px rgba(217,58,37,.3)}
  .cta-a:hover{background:var(--beni-lt);transform:translateY(-2px)}
  .cta-b{border:1px solid var(--line);color:var(--rice);background:var(--ink-2)}
  .cta-b:hover{border-color:var(--dashi);color:var(--dashi);transform:translateY(-2px)}

  /* ---------- seções ---------- */
  section{padding-block:56px 12px;scroll-margin-top:84px}
  .sec-head{margin-bottom:30px}
  .eyebrow{
    display:flex;align-items:center;gap:10px;
    font-family:var(--display);font-weight:500;font-size:13px;
    letter-spacing:.3em;color:var(--beni-lt);margin-bottom:8px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .sec-head h2{
    font-family:var(--display);font-weight:800;
    font-size:clamp(28px,6.4vw,42px);letter-spacing:.06em;margin:0;line-height:1.1;
  }
  .sec-note{margin:10px 0 0;color:var(--ash);font-size:15px;max-width:46ch}

  /* ---------- pratos ---------- */
  .dishes{display:grid;gap:4px}
  .dishes.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 34px}

  .dish{
    display:flex;align-items:center;gap:18px;width:100%;text-align:left;
    background:none;border:0;border-top:1px solid var(--line);
    padding:18px 4px;margin:0;color:inherit;font:inherit;cursor:pointer;
    transition:background .2s ease;
  }
  .dish:first-child{border-top:0}
  .dishes.two .dish:nth-child(2){border-top:0}
  .dish:hover{background:rgba(233,197,121,.045)}
  .dish:hover .thumb{transform:scale(1.05)}
  .dish:hover .thumb::after{opacity:1}

  .thumb{
    position:relative;flex:0 0 auto;
    width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--ink-3);
    box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 0 1px rgba(246,239,228,.09);
    transition:transform .28s cubic-bezier(.2,.7,.3,1);
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    box-shadow:inset 0 0 0 2px var(--dashi);opacity:0;transition:opacity .2s ease;
  }
  .thumb.empty{display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--beni)}

  .dish-body{flex:1;min-width:0}
  .dish-name{
    display:block;font-family:var(--display);font-weight:700;
    font-size:19px;letter-spacing:.02em;line-height:1.25;margin:0;
  }
  .dish-desc{display:block;margin:5px 0 0;color:var(--ash);font-size:14px;line-height:1.55}
  .tag{
    display:inline-block;margin-top:8px;
    font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dashi);border:1px solid rgba(233,197,121,.34);
    border-radius:999px;padding:3px 9px;
  }
  .selo-esgotado{
    display:inline-block;margin-top:8px;
    font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--beni-lt);border:1px solid rgba(255,106,72,.4);
    border-radius:999px;padding:3px 9px;
  }

  .price{
    flex:0 0 auto;align-self:center;
    font-family:var(--display);font-weight:700;font-size:22px;color:var(--dashi);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .price small{font-size:12px;font-weight:500;color:var(--ash-dim);margin-right:2px}

  /* esgotado */
  .dish.fora .thumb img{filter:grayscale(1) brightness(.55)}
  .dish.fora .dish-name,.dish.fora .price{color:var(--ash-dim)}
  .dish.fora .price{text-decoration:line-through;text-decoration-color:rgba(172,156,143,.5)}
  .dish.fora .dish-desc{color:var(--ash-dim)}

  /* ---------- destaques ---------- */
  .specials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .special{
    display:flex;flex-direction:column;align-items:flex-start;text-align:left;
    background:linear-gradient(180deg,var(--ink-2),var(--ink));
    border:1px solid rgba(233,197,121,.22);border-radius:18px;
    padding:24px 22px;color:inherit;font:inherit;cursor:pointer;
    transition:border-color .2s ease, transform .2s ease;
  }
  .special:hover{border-color:var(--dashi);transform:translateY(-3px)}
  .special .thumb{width:104px;height:104px;margin-bottom:16px}
  .special .dish-name{font-size:24px}
  .special .dish-desc{font-size:14.5px}
  .special .price{align-self:flex-start;margin-top:14px;font-size:26px}
  .special.fora .thumb img{filter:grayscale(1) brightness(.55)}
  .special.fora .dish-name,.special.fora .price{color:var(--ash-dim)}

  /* ---------- bebidas ---------- */
  .drinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 40px}
  .drink{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
  .drink:first-child,.drink:nth-child(2){border-top:0}
  .drink-name{font-size:16px;font-weight:500}
  .drink.fora .drink-name,.drink.fora .drink-price{color:var(--ash-dim)}
  .drink.fora .drink-price{text-decoration:line-through}
  .drink.fora .garrafa img{filter:grayscale(1) brightness(.55)}

  /* a garrafa no inicio da linha, em pe sobre uma sombra curta */
  .garrafa{flex:0 0 46px;height:58px;display:grid;place-items:center;position:relative}
  .garrafa::after{
    content:"";position:absolute;left:50%;bottom:1px;translate:-50% 0;
    width:70%;height:6px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);
  }
  .garrafa.vazia::after{display:none}
  .garrafa img{
    max-height:56px;max-width:46px;width:auto;height:auto;position:relative;z-index:1;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));
  }
  .dots{
    flex:1;height:1px;
    background-image:radial-gradient(circle, var(--ash-dim) 1px, transparent 1.2px);
    background-size:6px 1px;background-repeat:repeat-x;opacity:.5;
  }
  .drink-price{
    font-family:var(--display);font-weight:700;font-size:17px;color:var(--dashi);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .drink-price small{font-size:11px;font-weight:500;color:var(--ash-dim);margin-right:3px}

  /* ---------- rodapé ---------- */
  footer{
    margin-top:64px;padding-block:40px 48px;
    border-top:1px solid var(--line);background:var(--ink-2);text-align:center;
  }
  footer .badge{width:76px;height:76px;margin-bottom:18px}
  .foot-name{
    font-family:var(--display);font-weight:800;font-size:20px;
    letter-spacing:.16em;margin:0 0 6px;text-indent:.16em;
  }
  .foot-sub{margin:0;color:var(--ash);font-size:14.5px}
  .foot-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .fine{margin:26px auto 0;max-width:40ch;color:var(--ash-dim);font-size:12.5px;line-height:1.6}

  /* ---------- ampliar foto ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;
    background:rgba(9,7,6,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .lb-card{width:min(340px,100%);text-align:center;animation:pop .28s cubic-bezier(.2,.8,.3,1) both}
  .lb-card img{
    width:220px;height:220px;margin:0 auto 22px;border-radius:50%;object-fit:cover;
    box-shadow:0 22px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(246,239,228,.14), 0 0 60px rgba(217,58,37,.22);
  }
  .lb-card h3{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 8px;text-wrap:balance}
  .lb-card p{margin:0;color:var(--ash);font-size:14.5px;line-height:1.6}
  .lb-price{display:inline-block;margin-top:18px;font-family:var(--display);font-weight:700;font-size:26px;color:var(--dashi)}
  .lb-close{
    display:block;margin:24px auto 0;background:none;border:1px solid var(--line);color:var(--ash);
    font:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    padding:9px 18px;border-radius:999px;cursor:pointer;
  }
  .lb-close:hover{color:var(--rice);border-color:var(--ash)}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}

  /* ================= PAINEL DO ADMINISTRADOR ================= */
  .admin{
    position:fixed;inset:0;z-index:100;
    background:var(--ink);overflow-y:auto;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .tranca{
    min-height:100%;display:grid;place-items:center;padding:28px 20px;
  }
  .tranca-cartao{
    width:100%;max-width:420px;
    border:1px solid var(--line);border-radius:18px;background:var(--ink-2);padding:28px 24px;
  }
  .tranca-cartao h2{
    font-family:var(--display);font-weight:800;font-size:22px;
    letter-spacing:.04em;margin:0 0 6px;
  }
  .tranca-cartao > p{margin:0 0 20px;color:var(--ash);font-size:14.5px;line-height:1.6}
  .tranca-erro{color:var(--beni-lt);font-size:14px;margin:0 0 14px}
  .tranca-nota{margin:18px 0 0;color:var(--ash-dim);font-size:13px;line-height:1.6}
  .tranca-nota button{
    background:none;border:0;padding:0;font:inherit;font-size:13px;
    color:var(--dashi);text-decoration:underline;cursor:pointer;
  }

  .admin-bar{
    position:sticky;top:0;z-index:5;
    background:rgba(18,14,12,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .admin-bar-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px}
  .admin-bar h2{
    font-family:var(--display);font-weight:800;font-size:17px;
    letter-spacing:.12em;margin:0;flex:1;min-width:150px;
  }
  .admin-in{padding-block:26px 70px}

  .aviso{
    border:1px solid rgba(233,197,121,.3);background:rgba(233,197,121,.07);
    border-radius:12px;padding:14px 16px;margin-bottom:24px;
    color:var(--dashi);font-size:14px;line-height:1.6;
  }
  .aviso.ruim{border-color:rgba(255,106,72,.35);background:rgba(255,106,72,.08);color:var(--beni-lt)}

  .bloco{
    border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-bottom:18px;background:var(--ink-2);
  }
  .bloco > h3{
    font-family:var(--display);font-weight:700;font-size:17px;
    margin:0 0 4px;letter-spacing:.04em;
  }
  .bloco > .dica{margin:0 0 18px;color:var(--ash);font-size:13.5px}

  .campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .campo{display:flex;flex-direction:column;gap:6px;min-width:0}
  .campo.largo{grid-column:1 / -1}
  .campo label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ash)}
  .campo input,.campo textarea,.campo select{
    font:inherit;font-size:15px;color:var(--rice);
    background:var(--ink-3);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;width:100%;
  }
  .campo textarea{min-height:76px;resize:vertical;line-height:1.5}
  .campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--dashi);outline:none}
  .campo .ajuda{font-size:12px;color:var(--ash-dim)}

  .linha-item{
    display:flex;align-items:center;gap:14px;
    padding:12px 4px;border-top:1px solid var(--line);
  }
  .linha-item:first-of-type{border-top:0}
  .mini{
    width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    background:var(--ink-3);box-shadow:0 0 0 1px rgba(246,239,228,.09);
  }
  .mini.vazia{display:grid;place-items:center;font-family:var(--display);color:var(--beni);font-size:20px}
  /* garrafas no painel: inteiras, sem recorte redondo */
  .mini.inteira{object-fit:contain;border-radius:8px;background:transparent;box-shadow:none}
  .linha-corpo{flex:1;min-width:0}
  .linha-nome{display:block;font-weight:700;font-size:15.5px}
  .linha-sub{display:block;color:var(--ash);font-size:13px;margin-top:2px}
  .linha-acoes{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}

  .bt{
    font:inherit;font-size:13px;font-weight:700;
    background:var(--ink-3);border:1px solid var(--line);color:var(--rice);
    border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap;
  }
  .bt:hover{border-color:var(--dashi);color:var(--dashi)}
  .bt.mini-bt{padding:7px 10px;font-size:12px}
  .bt.perigo:hover{border-color:var(--beni);color:var(--beni-lt)}
  .bt.forte{background:var(--beni);border-color:var(--beni);color:#fff}
  .bt.forte:hover{background:var(--beni-lt);border-color:var(--beni-lt);color:#fff}
  .bt.forte[disabled]{opacity:.42;cursor:default;background:var(--ink-3);border-color:var(--line);color:var(--ash)}
  .bt.ok{border-color:rgba(233,197,121,.45);color:var(--dashi)}

  .grupo-secao{margin-bottom:22px}
  .grupo-secao > h4{
    font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--beni-lt);margin:0 0 6px;
  }

  .foto-edit{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .foto-edit .mini{width:86px;height:86px}
  .foto-edit input[type=file]{display:none}

  .qr-area{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .qr-caixa{background:#fff;padding:12px;border-radius:12px;line-height:0}
  .qr-caixa canvas,.qr-caixa img{display:block}
  .qr-lado{flex:1;min-width:220px}
  .link-publico{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    color:var(--dashi);word-break:break-all;background:var(--ink-3);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:0 0 12px;
  }

  @media (max-width:720px){
    .dishes.two{grid-template-columns:1fr;gap:0}
    .dishes.two .dish:nth-child(2){border-top:1px solid var(--line)}
    .specials{grid-template-columns:1fr}
    .drinks{grid-template-columns:1fr;gap:0}
    .drink:nth-child(2){border-top:1px solid var(--line)}
    .bar-in{flex-wrap:wrap;gap:8px}
    .tabs{margin-left:0;width:100%;
      -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
      mask-image:linear-gradient(90deg,#000 88%,transparent)}
    .thumb{width:76px;height:76px}
    .dish{gap:14px;padding:16px 2px}
    .dish-name{font-size:17.5px}
    .price{font-size:20px}
    .campos{grid-template-columns:1fr}
    .linha-item{flex-wrap:wrap}
    .linha-acoes{width:100%;justify-content:flex-start}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
    .dish:hover .thumb,.special:hover,.cta:hover{transform:none}
  }
</style>

<header class="bar">
  <div class="wrap bar-in">
    <a class="bar-mark" href="#topo">
      <img data-logo alt="">
      <b id="marca-nome">AIKISSOBA</b>
    </a>
    <nav class="tabs" id="tabs" aria-label="Seções do cardápio"></nav>
  </div>
</header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  const $ = s => document.querySelector(s);

  /* ---------------- dados ---------------- */
  const original = JSON.parse(document.getElementById("dados").textContent);
  let dados = clonar(original);
  let sujo = false;

  function clonar(o){ return JSON.parse(JSON.stringify(o)); }
  const ACENTOS = new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + "]", "g");
  const ehLista = secaoId => {
    const sec = dados.secoes.find(x => x.id === secaoId);
    return !!(sec && sec.estilo === "lista");
  };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function itensDa(secaoId){
    return dados.itens.filter(i => i.secao === secaoId);
  }

  /* ---------------- cardápio do cliente ---------------- */
  function foto(it, classe){
    if (it.foto) return `<span class="${classe}"><img src="${esc(it.foto)}" alt="${esc(it.nome)}" loading="lazy"></span>`;
    return `<span class="${classe} empty" aria-hidden="true">特</span>`;
  }

  function linhaPrato(it){
    const fora = it.esgotado ? " fora" : "";
    return `<button class="dish${fora}" type="button" data-item="${esc(it.id)}">
      ${foto(it, "thumb")}
      <span class="dish-body">
        <span class="dish-name">${esc(it.nome)}</span>
        <span class="dish-desc">${esc(it.desc)}</span>
        ${it.esgotado ? `<span class="selo-esgotado">Esgotado hoje</span>` : (it.tag ? `<span class="tag">${esc(it.tag)}</span>` : "")}
      </span>
      <span class="price"><small>R$</small>${esc(it.preco)}</span>
    </button>`;
  }

  function cardDestaque(it){
    const fora = it.esgotado ? " fora" : "";
    return `<button class="special${fora}" type="button" data-item="${esc(it.id)}">
      ${foto(it, "thumb")}
      <span class="dish-name">${esc(it.nome)}</span>
      <span class="dish-desc">${esc(it.desc)}</span>
      ${it.esgotado ? `<span class="selo-esgotado">Esgotado hoje</span>` : (it.tag ? `<span class="tag">${esc(it.tag)}</span>` : "")}
      <span class="price"><small>R$</small>${esc(it.preco)}</span>
    </button>`;
  }

  // comFoto: alguma bebida da secao tem foto. Quem nao tem ganha o espaco vazio,
  // para os nomes continuarem alinhados.
  function linhaBebida(it, comFoto){
    const fora = it.esgotado ? " fora" : "";
    const garrafa = it.foto
      ? `<span class="garrafa"><img src="${esc(it.foto)}" alt="${esc(it.nome)}" loading="lazy"></span>`
      : (comFoto ? `<span class="garrafa vazia" aria-hidden="true"></span>` : "");
    return `<div class="drink${fora}">
      ${garrafa}
      <span class="drink-name">${esc(it.nome)}</span>
      <span class="dots"></span>
      <span class="drink-price"><small>R$</small>${esc(it.preco)}</span>
    </div>`;
  }

  function renderCliente(){
    document.querySelectorAll("[data-logo]").forEach(i => { if (dados.site.logo) i.src = dados.site.logo; });
    document.getElementById("marca-nome").textContent = dados.site.nome;
    document.getElementById("hero-nome").textContent = dados.site.nome;
    document.getElementById("foot-nome").textContent = dados.site.nome;
    document.getElementById("hero-chamada").textContent = dados.site.chamada;

    document.getElementById("tabs").innerHTML = dados.secoes
      .map(s => `<a href="#${esc(s.id)}">${esc(s.nome)}</a>`).join("");

    document.getElementById("secoes").innerHTML = dados.secoes.map(s => {
      const itens = itensDa(s.id);

  function ligarScrollspy(){
    if (!("IntersectionObserver" in window)) return;
    if (io) io.disconnect();
    const tabs = [...document.querySelectorAll(".tabs a")];
    io = new IntersectionObserver(entradas => {
      const visivel = entradas.filter(x => x.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (visivel) tabs.forEach(t => t.setAttribute("aria-current", String(t.hash === "#" + visivel.target.id)));
    }, { rootMargin: "-88px 0px -62% 0px" });
    document.querySelectorAll("#secoes section").forEach(s => io.observe(s));

  const MARCA_DADOS = "__" + "DADOS" + "__";

  function gerarDocumento(d){
    const modelo = decodificar(tplB64);

    return modelo.replace(MARCA_TPL, () => tplB64).replace(MARCA_DADOS, () => json);

    return hex(buf);

  /* -------- foto: recorte quadrado + redução -------- */
  // inteira: para bebidas. Nao corta em quadrado (decapitaria a garrafa) e sai em
  // PNG, que mantem o fundo transparente de uma foto ja recortada.
  function processarFoto(file, inteira){
    return new Promise((ok, falhou) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          if (inteira){
            const c = document.createElement("canvas");
            const fator = Math.min(1, 240 / Math.max(img.naturalWidth, img.naturalHeight));
            c.width = Math.max(1, Math.round(img.naturalWidth * fator));
            c.height = Math.max(1, Math.round(img.naturalHeight * fator));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            ok(c.toDataURL("image/png"));
            return;
          }
          const N = 420;
          const c = document.createElement("canvas");
          c.width = N; c.height = N;
          const ctx = c.getContext("2d");
          const lado = Math.min(img.naturalWidth, img.naturalHeight);
          ctx.drawImage(img,
            (img.naturalWidth - lado)/2, (img.naturalHeight - lado)/2, lado, lado,
            0, 0, N, N);
          ok(c.toDataURL("image/jpeg", 0.78));
        } catch (e) { falhou(e); }
        finally { URL.revokeObjectURL(url); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); falhou(new Error("arquivo não é uma imagem")); };
      img.src = url;
    });
  }

    }
    if (acao === "excluir"){
      const it = dados.itens.find(x => x.id === id);
      if (it && window.confirm(`Excluir "${it.nome}" do cardápio?`)){
        dados.itens = dados.itens.filter(x => x.id !== id);
        if (editando === id) editando = null;
        renderAdmin();
      }
      return;
    }
    if (acao === "subir" || acao === "descer"){ mover(id, acao === "subir" ? -1 : 1); return; }

    if (acao === "secao-subir" || acao === "secao-descer"){
      const i = dados.secoes.findIndex(s => s.id === id);
      const j = i + (acao === "secao-subir" ? -1 : 1);
      if (i >= 0 && j >= 0 && j < dados.secoes.length){
        const t = dados.secoes[i]; dados.secoes[i] = dados.secoes[j]; dados.secoes[j] = t;
        renderAdmin();
      }
      return;
    }
    if (acao === "secao-editar"){ editarSecao(id); return; }
    if (acao === "secao-nova"){ editarSecao(null); return; }

    if (acao === "salvar-senha"){
      const aviso = document.getElementById("aviso-senha");
      const u = document.getElementById("ac-user").value.trim();
      const s1 = document.getElementById("ac-s1").value;
      const s2 = document.getElementById("ac-s2").value;
      if (!u){ aviso.textContent = "Escolha um nome de usuário."; return; }
      if (s1 || s2 || !temSenha()){
        if (s1.length < 6){ aviso.textContent = "A senha precisa de pelo menos 6 caracteres."; return; }
        if (s1 !== s2){ aviso.textContent = "As duas senhas não são iguais."; return; }
        const sal = novoSal();
        const h = await resumo(s1, sal);
        if (h === null){ aviso.textContent = "Este navegador não conseguiu preparar a senha. Abra a página por https."; return; }
        dados.site.admSal = sal;
        dados.site.admHash = h;
      }
      dados.site.admUser = u;
      renderAdmin();
      const a2 = document.getElementById("aviso-senha");
      if (a2) a2.textContent = "Guardado aqui. Clique em Publicar para valer de verdade.";
      return;
    }
    if (acao === "copiar-link"){
      const url = (dados.site.url || "").trim();
      try { await navigator.clipboard.writeText(url); bt.textContent = "Copiado!"; setTimeout(() => bt.textContent = "Copiar link", 1600); }
      catch (err) { bt.textContent = "Copie da caixa acima"; setTimeout(() => bt.textContent = "Copiar link", 2200); }
      return;
    }
    if (acao === "refazer-qr"){
      const caixa = document.querySelector('[data-campo="site.url"]');
      if (caixa) dados.site.url = caixa.value.trim();
      const p = document.getElementById("link-publico");
      if (p) p.textContent = dados.site.url;
      desenharQR(); marcarSujo(); return;
    }
  });

  corpoAdmin.addEventListener("change", async e => {
    if (e.target.id === "arquivo-foto"){
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const peso = document.getElementById("peso-foto");
      if (peso) peso.textContent = "Processando…";
      try {
        const selSecao = document.querySelector('#form-item [data-campo="secao"]');
        const inteira = selSecao ? ehLista(selSecao.value) : false;
        fotoPendente = await processarFoto(file, inteira);
        const p = document.getElementById("previa");
        if (p){
          const img = document.createElement("img");
          img.className = inteira ? "mini inteira" : "mini";
          img.id = "previa"; img.src = fotoPendente; img.alt = "";
          p.replaceWith(img);
        }
        if (peso) peso.textContent = Math.round(fotoPendente.length/1400) + " KB aprox.";
      } catch (err) {
        if (peso) peso.textContent = "Não consegui ler essa imagem. Tente outra.";
      }
      return;
    }
    // campos da casa
    const campoNome = e.target.dataset ? e.target.dataset.campo : null;
    if (campoNome && campoNome.indexOf("site.") === 0){
      dados.site[campoNome.slice(5)] = e.target.value.trim();
      if (campoNome === "site.url"){
        const p = document.getElementById("link-publico");
        if (p) p.textContent = dados.site.url;
        desenharQR();
      }
      marcarSujo();
    }
  });

  function rolarAoForm(){
    const f = document.getElementById("form-item");
    if (f) f.scrollIntoView({block:"start", behavior:"smooth"});
  }

  function mover(id, passo){
    const it = dados.itens.find(x => x.id === id);
    if (!it) return;
    const irmaos = itensDa(it.secao);
    const pos = irmaos.indexOf(it);
    const alvo = irmaos[pos + passo];
    if (!alvo) return;
    const a = dados.itens.indexOf(it), b = dados.itens.indexOf(alvo);
    dados.itens[a] = alvo; dados.itens[b] = it;
    renderAdmin();
  }

  function salvarItem(){
    const form = document.getElementById("form-item");
    if (!form) return;
    const val = k => {
      const el = form.querySelector(`[data-campo="${k}"]`);
      if (!el) return "";
      return el.type === "checkbox" ? el.checked : el.value.trim();
    };
    const nome = val("nome");
    if (!nome){ window.alert("O prato precisa de um nome."); return; }

    if (editando === "novo"){
      const novo = {
        id: "i" + Date.now().toString(36),
        secao: val("secao"), nome, desc: val("desc"), preco: val("preco"),
        tag: val("tag"), esgotado: !!val("esgotado"),
        foto: fotoPendente || ""
      };
      dados.itens.push(novo);
    } else {
      const it = dados.itens.find(x => x.id === editando);
      if (it){
        it.secao = val("secao"); it.nome = nome; it.desc = val("desc");
        it.preco = val("preco"); it.tag = val("tag"); it.esgotado = !!val("esgotado");
        if (fotoPendente !== null) it.foto = fotoPendente;
      }
    }
    editando = null; fotoPendente = null;
    renderAdmin();
  }

  function editarSecao(id){
    const s = id ? dados.secoes.find(x => x.id === id) : null;
    const nome = window.prompt("Nome da seção:", s ? s.nome : "");
    if (nome === null || !nome.trim()) return;
    const nota = window.prompt("Frase abaixo do título (pode deixar vazio):", s ? (s.nota || "") : "");
    if (nota === null) return;
    if (s){ s.nome = nome.trim(); s.nota = nota.trim(); }
    else {
      const slug = nome.trim().toLowerCase().normalize("NFD").replace(ACENTOS, "").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || ("s" + Date.now().toString(36));
      dados.secoes.push({ id: slug, nome: nome.trim(), kanji: "", nota: nota.trim(), estilo: "fotos" });
    }
    renderAdmin();
  }

  /* -------- publicar -------- */
  btPublicar.addEventListener("click", async () => {
    if (!artifact){ window.alert("Publicação indisponível nesta visualização."); return; }
    btPublicar.disabled = true;
    publicando = true;
    btPublicar.textContent = "Publicando…";
    try {
      try { sessionStorage.setItem("aikissoba:admin", "1"); } catch (e) {}
      await artifact.publish(gerarDocumento(dados));
      btPublicar.textContent = "Publicado!";
    } catch (err) {
      const code = err && err.code;
      if (code === "conflict"){
        btPublicar.textContent = "Alguém publicou antes — recarregando";
      } else if (code === "not_writer" || code === "not_granted" || code === "consent_required"){
        podePublicar = false; publicando = false;
        btPublicar.textContent = "Sem permissão";
        renderAdmin();
      } else if (code === "too_large"){
        publicando = false;
        window.alert("O cardápio ficou grande demais — remova alguma foto antes de publicar.");
        btPublicar.disabled = false; btPublicar.textContent = "Publicar";
      } else {
        publicando = false;
        btPublicar.textContent = "Não deu — tente de novo";
        btPublicar.disabled = false;
        setTimeout(() => btPublicar.textContent = "Publicar", 2600);
      }
    }
  });

  btDescartar.addEventListener("click", () => {
    if (!window.confirm("Descartar as alterações que ainda não foram publicadas?")) return;
    dados = clonar(original);
    editando = null; fotoPendente = null;
    renderCliente();
    renderAdmin();
  });

  document.getElementById("fechar-admin").addEventListener("click", () => { renderCliente(); fecharAdmin(); });

  window.addEventListener("beforeunload", e => {
    if (sujo && !publicando){ e.preventDefault(); e.returnValue = ""; }
  });

  /* ---------------- partida ---------------- */
  renderCliente();

  (async function(){
    if (window.claude && typeof window.claude.use === "function"){
      try {
        const [u, a] = await Promise.all([window.claude.use("user"), window.claude.use("artifact")]);
        artifact = a;
        // sem identidade nesta visualização, deixa tentar: o servidor decide
        podePublicar = u ? await u.canEdit() : !!artifact;
      } catch (e) { /* visitante comum: segue só com o cardápio */ }
    }

    try { destravado = sessionStorage.getItem("aikissoba:destravado") === "1"; } catch (e) {}

    // Fora da plataforma (ex.: a cópia no GitHub Pages) não há onde salvar,
    // então o painel nem abre. Localhost fica liberado para testes.
    const naPlataforma = !!(window.claude && typeof window.claude.use === "function");
    const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    if (!naPlataforma && !local) return;

    let reabrir = false;
    try {
      reabrir = sessionStorage.getItem("aikissoba:admin") === "1";
      sessionStorage.removeItem("aikissoba:admin");
    } catch (e) {}
    if (reabrir || location.hash === "#admin") abrirAdmin();
  })();
})();
</script>
